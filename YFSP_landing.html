<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olish Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1F19;
    --paper:#FFF9F5;
    --card:#FFFFFF;
    --edge:#EDE1D9;
    --accent:#FF87A5;
    --accent-deep:#E85C81;
    --btn:#3AE3BC;
    --btn-deep:#22C7A0;
    --btn-text:#123128;
    --muted:#716C5E;
    --label:#8A8571;
    --dash:#D3CBB2;
    --well:#FBF9F3;
    --shadow:rgba(28,31,25,.09);
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F7F1EC;
      --paper:#1A1B18;
      --card:#232420;
      --edge:#3A382F;
      --muted:#B4AE9E;
      --label:#95907E;
      --dash:#4A473B;
      --well:#1F201C;
      --shadow:rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F7F1EC;
    --paper:#1A1B18;
    --card:#232420;
    --edge:#3A382F;
    --muted:#B4AE9E;
    --label:#95907E;
    --dash:#4A473B;
    --well:#1F201C;
    --shadow:rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  header{
    max-width:860px;margin:0 auto;padding:34px 28px 0;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .wordmark{
    font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.01em;
    color:var(--ink);text-transform:uppercase;
  }
  .wordmark em{font-style:italic;color:var(--accent-deep);}

  .ig{
    display:inline-flex;align-items:center;justify-content:center;
    width:46px;height:46px;border-radius:999px;color:var(--ink);
    border:1px solid transparent;
    transition:color .15s ease, background-color .15s ease, border-color .15s ease;
  }
  .ig:hover{color:var(--accent-deep);background:var(--card);border-color:var(--edge);}
  .ig:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;}
  .ig svg{width:24px;height:24px;display:block;}

  main{max-width:860px;margin:0 auto;padding:44px 28px 80px;text-align:center;}

  .intro{max-width:620px;margin:0 auto 38px;}
  .intro h1{
    font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.6vw,44px);
    line-height:1.12;margin:0 0 14px;text-wrap:balance;
  }
  .intro h1 em{font-style:italic;color:var(--accent-deep);}
  .intro p{color:var(--muted);font-size:16.5px;margin:0;}

  .frame{
    background:var(--card);border:1px solid var(--edge);border-radius:18px;
    padding:14px;margin:0 0 34px;box-shadow:0 14px 30px var(--shadow);
  }
  .screen{
    aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--well);
  }
  .screen iframe,.screen video{width:100%;height:100%;border:0;display:block;}
  .screen video{object-fit:contain;background:#14150F;}

  /* Delete this block once the Canva embed is in */
  .placeholder{
    width:100%;height:100%;border-radius:12px;
    border:1.5px dashed var(--dash);background:var(--well);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--label);text-align:center;padding:18px;
  }
  .placeholder svg{width:34px;height:34px;opacity:.55;}
  .placeholder span{font-size:12.5px;font-weight:500;letter-spacing:.02em;}
  .placeholder small{font-size:11px;color:var(--label);opacity:.8;}

  .actions{display:flex;flex-direction:column;align-items:center;gap:14px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;max-width:320px;min-height:52px;
    font-family:var(--sans);font-weight:600;font-size:16px;
    border-radius:999px;padding:13px 24px;text-decoration:none;cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-primary{
    color:var(--btn-text);background:var(--btn);border:1px solid var(--btn);
  }
  .btn-primary:hover{background:var(--btn-deep);border-color:var(--btn-deep);}
  .btn-primary:focus-visible{outline:2px solid var(--btn-deep);outline-offset:2px;}

  .btn-secondary{
    color:var(--ink);background:var(--card);border:1px solid var(--edge);
  }
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent-deep);}
  .btn-secondary:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;}

  footer{
    max-width:860px;margin:0 auto;padding:0 28px 50px;
    color:var(--label);font-size:13px;text-align:center;
  }

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  @media (max-width:560px){
    header{padding:24px 20px 0;}
    main{padding:32px 20px 60px;}
    footer{padding:0 20px 40px;}
    .frame{padding:10px;}
  }
</style>
</head>
<body>

<header>
  <span class="wordmark">Olish <em>Studio</em></span>
  <a class="ig" href="https://www.instagram.com/occasionalish/" target="_blank" rel="noopener" aria-label="Occasionalish on Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>
    </svg>
  </a>
</header>

<main>
  <div class="intro">
    <h1>Your <em>italic</em> First</h1>
    <p>Stationery Product</p>
  </div>

  <div class="frame">
    <div class="screen">
      <video controls playsinline preload="metadata">
        <source src="YFSPVSL_SHORT.mp4" type="video/mp4">
        Your browser can't play this video.
      </video>
    </div>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="[BOOKING LINK]">Book a call</a>
    <a class="btn btn-secondary" href="[COMMUNITY LINK]">Join community</a>
  </div>
</main>

<footer>
  &copy; <span id="year"></span> Olish Studio
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
